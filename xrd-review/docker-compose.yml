services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xrd
      POSTGRES_PASSWORD: xrd
      POSTGRES_DB: xrd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrd -d xrd"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://xrd:xrd@db:5432/xrd
    ports:
      - "8000:8000"

volumes:
  pgdata:
